server.port=8081

# ========== 会话（管理权限永久有效） ==========
# 会话不因空闲过期（约 68 年）；JSESSIONID Cookie 持久化，关浏览器再开仍保持后台登录态
server.servlet.session.timeout=3650d
server.servlet.session.cookie.max-age=2147483647
server.servlet.session.cookie.http-only=true

# ========== 数据源（MySQL，root/123456；库 aurora 由 SchemaInitializer 自动创建） ==========
spring.datasource.url=jdbc:mysql://localhost:3306/aurora?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 仅用于启动时「无库连接」建库建表（复用上面的账号密码）
auth.db.admin-url=jdbc:mysql://localhost:3306/?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true

# ========== MyBatis-Plus ==========
mybatis-plus.global-config.db-config.id-type=auto
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
mybatis-plus.global-config.banner=false

# ========== 认证业务参数 ==========
# 图形验证码有效期（毫秒），与后端 CaptchaService 一致
auth.captcha.ttl-ms=300000

# ========== 后台管理系统 ==========
# 管理员账号（须为 app_user 表中的用户名；首次启动会自动播种该账号）
admin.username=admin
# 管理员初始密码（仅首次播种 app_user 时使用，登录后建议尽快修改）
admin.default-password=admin123456

# ========== 日志 ==========
logging.level.com.fenglin.springboottest=debug
logging.level.com.baomidou.mybatisplus=warn

# ========== 帖子媒体上传（发帖带图片/视频） ==========
# Spring Boot 默认单文件 1MB，太小；与前端 mediaStore 的限制对齐（图片 5MB、视频 60MB）
spring.servlet.multipart.max-file-size=60MB
spring.servlet.multipart.max-request-size=80MB

# 帖子媒体：磁盘 <root>/<subdir>，对外 URL /uploads/<subdir>/xxx（/uploads/** 静态映射到 root）
post.upload.root=uploads
post.upload.subdir=posts
