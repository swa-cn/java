spring.application.name=springBootTest
spring.profiles.active=dev
# 固化 HTTP 端口为 8081：覆盖 DevTools 在启动时可能把 server.port 改写成随机端口的行为，
# 确保 mvnw spring-boot:run（以及 start.bat / start-all.bat）稳定监听 8081，与前端 Vite 代理一致。
server.port=8081
# 关闭 devtools 自动重启：它监控 target/classes，编译一次就重启一次，
# 重启期间 8081 短暂不可用，会导致登录等请求失败（表现为「账号不存在」）。
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

# ---- 日志 ----
# 注：properties 文件注释请用 ASCII/UTF-8 保存，历史上 GBK 中文注释会变成乱码（#?????）。
logging.level.root=info
logging.level.com.fenglin.springboottest=debug
# 日志文件（相对项目根的 log/ 目录）
logging.file.name=log/xx.log
# 控制台输出格式
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss}  %level %logger{50}.%M %L:%m%n
# 文件输出格式（此前误写成 "logging.pattern.console=..." 字符串，等于没配，已修正）
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss}  %level %logger{50}.%M %L:%m%n
